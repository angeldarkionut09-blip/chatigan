services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: "1"
      DATABASE_URL: file:/app/data/production.db
      APP_ORIGIN: https://chatiganu.auto-core.ro
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - chatigan-production-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  chatigan-production-data:
